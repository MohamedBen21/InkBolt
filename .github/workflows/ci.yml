name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check all JS
        run: |
          node -c extension/src/inkbolt-core.js
          node -c extension/src/content.js
          node -c extension/src/background.js
          node -c extension/src/popup.js
          node -c extension/epub-tool/app.js

      - name: Validate manifests are well-formed JSON
        run: |
          python3 -c "import json; json.load(open('extension/manifest.chrome.json'))"
          python3 -c "import json; json.load(open('extension/manifest.firefox.json'))"

      - name: Build extension packages
        run: |
          chmod +x extension/build.sh
          cd extension && ./build.sh

      - name: Confirm submission zips were produced
        run: |
          ls extension/dist/inkbolt-chrome-v*.zip
          ls extension/dist/inkbolt-firefox-v*.zip
