<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Inkbolt</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <svg class="logo" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
      <rect width="32" height="32" rx="8" fill="url(#g)" />
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#241a44" />
          <stop offset="1" stop-color="#150f27" />
        </linearGradient>
      </defs>
      <path d="M15 5 L9 17 L14 17 L12.5 27 L23 13 L17 13 L19 5 Z" fill="#FFC857" />
    </svg>
    <div class="wordmark">
      <h1>Inkbolt</h1>
      <span class="tagline">Bold words. Faster reading.</span>
    </div>
  </header>

  <section class="row">
    <div class="label">
      <strong>Enabled everywhere</strong>
      <span class="sub">Master switch for all sites</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="globalToggle" />
      <span class="slider"></span>
    </label>
  </section>

  <section class="row">
    <div class="label">
      <strong id="siteLabel">This site</strong>
      <span class="sub" id="siteSub">—</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="siteToggle" />
      <span class="slider"></span>
    </label>
  </section>

  <section class="slider-block">
    <div class="label">
      <strong>Bold intensity</strong>
      <span class="sub">How much of each word is bolded</span>
    </div>
    <input type="range" id="ratioSlider" min="30" max="70" step="5" />
    <div class="ratio-preview" id="ratioPreview"><span class="bold">Read</span>ing</div>
  </section>

  <button id="epubToolBtn" class="epub-btn">Convert an e-book (EPUB / TXT)</button>

  <p class="shortcut-hint">⌨️ <kbd>Ctrl+Shift+B</kbd> (<kbd>⌘+Shift+B</kbd> on Mac) toggles Inkbolt anywhere</p>

  <footer>
    <span id="statusMsg"></span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
